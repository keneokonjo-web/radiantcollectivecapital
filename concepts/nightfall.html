<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightfall</title>
<meta name="description" content="Concept A for Radiant Collective Capital: cinematic, deep navy, handwritten warmth.">
<link rel="icon" href="img/logo-mark.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="common.css">
<style>
:root{--navy:#0b1730;--ink:#060d1d;--cream:#fff1dc;--gold:#c9a261;--parch:#e8e3d8;--ease:cubic-bezier(.22,1,.36,1);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
body{background:var(--navy);color:var(--cream);font:300 1rem/1.65 var(--sans)}
.eyebrow{font:400 .72rem/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
em{font-style:italic}
/* intro */
.intro{position:fixed;inset:0;z-index:200;background:var(--ink);display:grid;place-items:center;animation:lift 1s var(--ease) 2.3s forwards}
.intro img{width:min(440px,70vw);opacity:0;filter:blur(10px);letter-spacing:0;animation:logoin 1.6s var(--ease) .3s forwards}
.intro i{position:absolute;left:50%;bottom:12vh;width:120px;height:1px;background:rgba(255,241,220,.2);transform:translateX(-50%);overflow:hidden}
.intro i::after{content:"";position:absolute;inset:0;background:var(--gold);transform:translateX(-100%);animation:bar 2s ease .2s forwards}
@keyframes logoin{to{opacity:1;filter:none}}@keyframes bar{to{transform:none}}@keyframes lift{to{transform:translateY(-101%);visibility:hidden}}
html.seen .intro{display:none}
/* header */
header{position:fixed;inset:0 0 auto 0;z-index:60;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px clamp(18px,3.4vw,48px);transition:background .5s,padding .5s}
header.solid{background:rgba(11,23,48,.86);backdrop-filter:blur(14px);padding-block:14px}
.menu-btn{justify-self:start;display:flex;align-items:center;gap:14px;font:400 .72rem var(--sans);letter-spacing:.22em;text-transform:uppercase}
.burger{display:grid;gap:6px;width:26px}.burger i{height:1px;background:var(--cream);transition:transform .5s var(--ease),width .5s var(--ease)}.burger i:last-child{width:16px}.menu-btn:hover .burger i:last-child{width:26px}
.brand img{width:clamp(130px,14vw,190px)}
.pill{justify-self:end;display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border:1px solid rgba(255,241,220,.5);border-radius:99px;font:400 .72rem var(--sans);letter-spacing:.2em;text-transform:uppercase;transition:background .4s,color .4s,border-color .4s}
.pill:hover{background:var(--cream);color:var(--navy);border-color:var(--cream)}
.pill.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}.pill.gold:hover{background:var(--cream);border-color:var(--cream)}
/* overlay menu */
.drawer{position:fixed;inset:0;z-index:100;background:var(--ink);display:grid;grid-template-columns:1.1fr 1fr;clip-path:inset(0 0 100% 0);transition:clip-path .9s var(--ease);visibility:hidden}
.drawer.open{clip-path:inset(0);visibility:visible}
.drawer .l{padding:clamp(90px,14vh,140px) clamp(24px,5vw,80px) 40px;display:flex;flex-direction:column;justify-content:center}
.drawer nav a{display:block;font:300 clamp(2.4rem,6vw,5.4rem)/1.08 var(--serif);overflow:hidden;color:var(--cream)}
.drawer nav a span{display:inline-block;transform:translateY(105%);transition:transform .9s var(--ease)}
.drawer.open nav a span{transform:none;transition-delay:calc(.25s + var(--i)*.07s)}
.drawer nav a:hover{font-style:italic;color:var(--gold)}
.drawer .r{background:url(img/p2.jpg) center/cover;position:relative}.drawer .r::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ink),transparent 40%)}
.close{position:absolute;top:24px;left:clamp(18px,3.4vw,48px);z-index:2;font:400 .72rem var(--sans);letter-spacing:.22em;text-transform:uppercase}
.drawer .dportal{margin-top:3rem;display:flex;flex-wrap:wrap;gap:.6rem 1.6rem;font-size:.8rem;color:rgba(255,241,220,.65)}
/* hero */
.hero{position:relative;height:100svh;min-height:640px;display:grid;align-items:end;overflow:hidden}
.hero .bg{position:absolute;inset:-6% 0;background:url(img/p1.jpg) 55% 30%/cover;filter:saturate(.85);animation:zoom 14s ease-out forwards;transform:scale(1.12)}
@keyframes zoom{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,13,29,.55),rgba(6,13,29,.1) 35%,rgba(11,23,48,.92) 100%)}
.hero .in{position:relative;z-index:2;padding:0 clamp(18px,3.4vw,48px) clamp(48px,9vh,96px)}
.hero h1{margin:0 0 1.8rem;font:300 clamp(3rem,1rem + 7.4vw,9.4rem)/.94 var(--serif);letter-spacing:-.025em}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.08em}.hero h1 .ln span{display:block;transform:translateY(108%);animation:rise 1.4s var(--ease) forwards;animation-delay:calc(2.7s + var(--i)*.14s)}
html.seen .hero h1 .ln span{animation-delay:calc(.2s + var(--i)*.14s)}
@keyframes rise{to{transform:none}}
.hero h1 .ln:last-child span{font-style:italic;color:var(--gold)}
.hero .row{display:flex;justify-content:space-between;align-items:end;gap:2rem;flex-wrap:wrap;opacity:0;animation:fade 1.4s ease 3.7s forwards}
html.seen .hero .row{animation-delay:1s}
@keyframes fade{to{opacity:1}}
.hero p{margin:0;max-width:34ch;font-size:1.05rem;color:rgba(255,241,220,.85)}
.scrollcue{display:flex;align-items:center;gap:12px;font:400 .68rem var(--sans);letter-spacing:.24em;text-transform:uppercase}.scrollcue i{width:1px;height:46px;background:linear-gradient(var(--gold),transparent);animation:cue 2s ease-in-out infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
/* statement */
.state{height:260vh;position:relative}
.state .stick{position:sticky;top:0;height:100svh;display:grid;place-items:center;padding:0 clamp(18px,6vw,120px)}
.state p{margin:0;max-width:20ch;font:300 clamp(2rem,1rem + 4.2vw,5.6rem)/1.08 var(--serif);letter-spacing:-.015em}
.state p .w{opacity:.16;transition:opacity .5s}.state p .w.on{opacity:1}
.state .eyebrow{position:absolute;top:18vh;left:clamp(18px,6vw,120px)}
/* collage */
.collage{position:relative;padding:12vh 0 18vh;min-height:130vh}
.collage figure{margin:0;position:absolute;overflow:hidden}.collage figure img{width:100%;height:116%;object-fit:cover}
.c1{left:7vw;top:6vh;width:34vw;aspect-ratio:4/3}.c2{right:6vw;top:40vh;width:26vw;aspect-ratio:3/4;z-index:2}.c3{left:14vw;top:70vh;width:24vw;aspect-ratio:3/4}
.collage .tx{position:absolute;z-index:3;left:30vw;top:30vh;max-width:15ch;font:300 clamp(2rem,1rem + 3.4vw,4.6rem)/1.02 var(--serif);mix-blend-mode:normal;text-shadow:0 2px 30px rgba(6,13,29,.6)}
.collage .tx em{color:var(--gold)}
.collage .small{position:absolute;right:8vw;top:92vh;max-width:30ch;color:rgba(255,241,220,.75)}
/* note */
.note{background:var(--parch);color:#1b1b1b;padding:clamp(80px,16vh,180px) clamp(18px,6vw,120px);position:relative}
.note .paper{max-width:900px;margin:0 auto;font:400 clamp(1.5rem,1rem + 1.8vw,2.6rem)/1.55 'La Belle Aurore',cursive;color:#12203f}
.note .paper p{margin:0 0 .5em}.note ul{list-style:none;padding:0;margin:1.2em 0 0}.note li{padding-left:1.4em;position:relative}.note li::before{content:"—";position:absolute;left:0}
.note .sign{margin-top:2rem;font-size:1.2em;text-align:right;color:#8a6a2c}
.note .eyebrow{display:block;margin-bottom:3rem;color:#8a6a2c;font-family:var(--sans)}
.note .line{position:relative;display:block}.note .line::after{content:"";position:absolute;left:0;bottom:.12em;height:1px;width:100%;background:rgba(18,32,63,.14)}
/* how */
.how{padding:clamp(80px,16vh,180px) clamp(18px,3.4vw,48px)}
.how h2{margin:0 0 clamp(2rem,6vh,5rem);font:300 clamp(2.2rem,1rem + 4vw,5.2rem)/1 var(--serif);max-width:15ch}
.how h2 em{color:var(--gold)}
.rows{border-top:1px solid rgba(255,241,220,.2)}
.row3{display:grid;grid-template-columns:90px 1.2fr 1fr;gap:2rem;align-items:baseline;padding:clamp(28px,5vh,56px) 0;border-bottom:1px solid rgba(255,241,220,.2);transition:padding .6s var(--ease),background .6s}
.row3:hover{padding-left:20px;background:linear-gradient(90deg,rgba(201,162,97,.08),transparent)}
.row3 b{font:300 1rem var(--serif);color:var(--gold);letter-spacing:.2em}
.row3 h3{margin:0;font:300 clamp(1.8rem,1rem + 2.6vw,3.6rem)/1.05 var(--serif)}
.row3 p{margin:0;color:rgba(255,241,220,.72);max-width:44ch}
/* membership */
.member{display:grid;grid-template-columns:1fr 1fr;min-height:100svh}
.member .ph{position:relative;overflow:hidden;min-height:60vh}.member .ph img{position:absolute;inset:-8% 0;width:100%;height:116%;object-fit:cover}
.member .ct{padding:clamp(60px,12vh,140px) clamp(24px,5vw,90px);display:flex;flex-direction:column;justify-content:center;background:var(--ink)}
.price{display:flex;align-items:baseline;gap:1.2rem;margin:1.4rem 0 .4rem;font-family:var(--serif)}
.price b{font-weight:300;font-size:clamp(4.5rem,9vw,8rem);line-height:.9;letter-spacing:-.03em}
.price s{font-size:1.8rem;color:rgba(255,241,220,.45)}
.badge{display:inline-block;color:var(--gold);font:400 .72rem var(--sans);letter-spacing:.2em;text-transform:uppercase}
.member ul{list-style:none;padding:0;margin:2rem 0 2.4rem}.member li{padding:.8rem 0;border-bottom:1px solid rgba(255,241,220,.14);display:flex;gap:1rem}.member li::before{content:"";flex:none;width:7px;height:7px;margin-top:.62em;border:1px solid var(--gold);transform:rotate(45deg)}
/* portal */
.portal{padding:clamp(70px,12vh,140px) clamp(18px,3.4vw,48px);display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,241,220,.14)}
.portal>div{background:var(--navy);padding:2rem 1.6rem 3rem;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;transition:background .5s}
.portal>div:hover{background:#101d3b}
.portal h4{margin:0 0 .6rem;font:300 1.7rem/1.1 var(--serif)}.portal p{margin:0;color:rgba(255,241,220,.65);font-size:.92rem}
.portal-wrap{padding:0}
/* closing */
.close-sec{position:relative;min-height:90svh;display:grid;place-items:center;text-align:center;overflow:hidden;padding:12vh 18px}
.close-sec .bg{position:absolute;inset:-8% 0;background:url(img/p3.jpg) center 30%/cover;filter:brightness(.42)}
.close-sec h2{position:relative;margin:0 0 1.4rem;font:300 clamp(2.6rem,1rem + 6vw,7.6rem)/.98 var(--serif);letter-spacing:-.02em}
.close-sec h2 em{color:var(--gold)}.close-sec p{position:relative;max-width:40ch;margin:0 auto 2.4rem;font-size:1.1rem}
.close-sec .btns{position:relative;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
/* footer */
footer{background:var(--ink);padding:clamp(60px,10vh,110px) clamp(18px,3.4vw,48px) 30px;overflow:hidden}
footer .top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:2rem}
footer h5{margin:0 0 1rem;font:400 .7rem var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
footer li{list-style:none;margin:.4rem 0}footer ul{padding:0;margin:0}footer a:hover{color:var(--gold)}
footer .big{display:block;width:100%;margin:5vw 0 1vw;opacity:.9}
footer .legal{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:2rem;font-size:.78rem;color:rgba(255,241,220,.5);position:relative}
@media (max-width:900px){
 .portal{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding-inline:18px}.portal>div{padding:1.4rem 1rem 2rem;min-width:0;min-height:200px}.portal h4{font-size:1.3rem;overflow-wrap:anywhere}
 header{grid-template-columns:auto 1fr auto;gap:10px}.brand{justify-self:center}.brand img{width:120px}.menu-btn span{display:none}.pill{padding:10px 16px}
 .drawer{grid-template-columns:1fr}.drawer .r{display:none}
 .collage{min-height:auto;padding:12vh 18px 10vh;display:grid;gap:18px}.collage figure,.collage .tx,.collage .small{position:relative;inset:auto;width:100%!important;max-width:none}.collage .tx{order:2;padding:1.2rem 0}.c2{width:70%!important;justify-self:end}.c3{width:60%!important}
 .row3{grid-template-columns:44px 1fr;gap:.6rem 1rem}.row3 p{grid-column:2}
 .member{grid-template-columns:1fr}footer .top{grid-template-columns:1fr 1fr}footer .top>:first-child{grid-column:1/-1}
 .state{height:220vh}
}
</style>
</head>
<body>
<div class="intro" aria-hidden="true"><img src="img/logo-cream.png" alt=""><i></i></div>

<header id="hd">
  <button class="menu-btn" id="open" aria-label="Open menu" aria-expanded="false"><span class="burger"><i></i><i></i></span><span>Menu</span></button>
  <a class="brand" href="#top" aria-label="Radiant Collective Capital"><img src="img/logo-cream.png" alt="Radiant Collective Capital" width="190" height="50"></a>
  <a class="pill" href="https://rcc.africa/">Apply</a>
</header>

<div class="drawer" id="drawer" role="dialog" aria-label="Menu">
  <button class="close" id="close">Close ✕</button>
  <div class="l">
    <nav data-list="nav"></nav>
    <div class="dportal" data-list="footer.portal"></div>
  </div>
  <div class="r"></div>
</div>

<main id="top">
<section class="hero">
  <div class="bg" id="herobg"></div>
  <div class="in">
    <h1 id="h1"></h1>
    <div class="row">
      <p id="sub"></p>
      <a class="pill gold" id="cta" href="#membership"></a>
      <span class="scrollcue"><i></i>Scroll</span>
    </div>
  </div>
</section>

<section class="state" id="state">
  <div class="stick"><span class="eyebrow" id="eyebrow"></span><p id="bridge"></p></div>
</section>

<section class="collage" aria-label="Our community">
  <figure class="c1" data-r><img data-k=".08" src="img/w1.jpg" alt="Two members laughing together over a book" loading="lazy"></figure>
  <figure class="c2" data-r style="--d:.15"><img data-k=".14" src="img/p3.jpg" alt="A smiling member in a bright headwrap" loading="lazy" style="object-position:70% 20%"></figure>
  <figure class="c3" data-r style="--d:.3"><img data-k=".1" src="img/p2.jpg" alt="A member looking up, smiling" loading="lazy" style="object-position:50% 20%"></figure>
  <p class="tx" id="seat" data-r></p>
  <p class="small" data-r id="build-short"></p>
</section>

<section class="note" aria-label="A note from Radiant">
  <div class="paper">
    <span class="eyebrow" id="note-eyebrow"></span>
    <p id="note-lead"></p>
    <ul data-list="enables"></ul>
    <p class="sign">— Radiant Collective Capital</p>
  </div>
</section>

<section class="how" id="how">
  <h2 id="how-h" data-r></h2>
  <div class="rows" data-list="pillars"></div>
</section>

<section class="member" id="membership">
  <div class="ph"><img src="img/w2.jpg" alt="A member smiling, seated, in a rust jumpsuit" loading="lazy" data-k=".06" style="object-position:50% 25%"></div>
  <div class="ct">
    <span class="eyebrow">Join a legacy-building movement</span>
    <div class="price"><b id="price"></b><s id="was"></s></div>
    <span class="badge" id="pnote"></span>
    <ul data-list="membership.includes"></ul>
    <div><a class="pill gold" id="mcta" href="https://rcc.africa/"></a></div>
  </div>
</section>

<section class="portal-wrap">
  <div class="portal" data-list="portal"></div>
</section>

<section class="close-sec">
  <div class="bg" data-k=".1"></div>
  <div>
    <h2 id="close-h" data-r></h2>
    <p id="close-p" data-r></p>
    <div class="btns" data-r><a class="pill gold" id="join" href="https://rcc.africa/"></a><a class="pill" id="speak" href="#"></a></div>
  </div>
</section>
</main>

<footer>
  <div class="top">
    <div><img src="img/logo-cream.png" alt="Radiant Collective Capital" width="200"></div>
    <div><h5>Company</h5><ul data-list="footer.company"></ul></div>
    <div><h5>Member Portal</h5><ul data-list="footer.portal"></ul></div>
    <div><h5>Follow Us</h5><ul data-list="footer.social"></ul></div>
  </div>
  <img class="big" src="img/logo-cream.png" alt="" aria-hidden="true">
  <div class="legal"><span>© <span data-year></span> Radiant Collective Capital. All rights reserved.</span><span>Privacy Policy · Cookies Settings</span></div>
</footer>

<a class="ctag" href="index.html">Concept A · Nightfall — compare</a>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
var R=RCC,$=function(i){return document.getElementById(i)};
$('h1').innerHTML=R.headline.map(function(l,i){return '<span class="ln" style="--i:'+i+'"><span style="--i:'+i+'">'+l+'</span></span>'}).join('');
$('sub').textContent=R.sub;$('cta').textContent=R.cta;$('eyebrow').textContent=R.eyebrow;
$('bridge').innerHTML=R.bridge.split(' ').map(function(w){return '<span class="w">'+w+'</span> '}).join('');
$('seat').innerHTML=R.statement[0]+' <em>'+R.statement[1]+'</em>';
$('build-short').textContent=R.sub+'.';
$('note-eyebrow').textContent='What we’re building';
$('note-lead').textContent=R.building;
R.each('enables',function(t){return '<li>'+t+'</li>'});
$('how-h').innerHTML=R.howTitle[0]+' <em>'+R.howTitle[1]+'</em> '+R.howTitle[2];
R.each('pillars',function(p,i){return '<div class="row3" data-r style="--d:'+i*.08+'"><b>0'+(i+1)+'</b><h3>'+p.t+'</h3><p>'+p.d+'</p></div>'});
$('price').textContent=R.membership.price;$('was').textContent=R.membership.was;$('pnote').textContent=R.membership.note;$('mcta').textContent=R.membership.cta;
R.each('membership.includes',function(t){return '<li>'+t+'</li>'});
R.each('portal',function(p){return '<div data-r><h4>'+p.t+'</h4><p>'+p.d+'</p></div>'});
$('close-h').innerHTML=R.closing.t[0]+' <em>'+R.closing.t[1]+'</em>';$('close-p').textContent=R.closing.d;$('join').textContent=R.closing.a;$('speak').textContent=R.closing.b;
R.each('nav',function(n,i){return '<a href="'+(n==='Apply'||n==='Login'?R.apply:'#')+'"><span style="--i:'+i+'">'+n+'</span></a>'});
R.each('footer.portal',function(n){return '<a href="#">'+n+'</a>'},'.drawer .dportal');
R.each('footer.portal',function(n){return '<li><a href="#">'+n+'</a></li>'},'footer ul[data-list="footer.portal"]');
R.each('footer.company',function(n){return '<li><a href="#">'+n+'</a></li>'});
R.each('footer.social',function(n){return '<li><a href="#">'+n+'</a></li>'});
/* menu */
var dr=$('drawer'),op=$('open');
function tog(o){dr.classList.toggle('open',o);op.setAttribute('aria-expanded',o);document.body.style.overflow=o?'hidden':''}
op.onclick=function(){tog(true)};$('close').onclick=function(){tog(false)};
addEventListener('keydown',function(e){if(e.key==='Escape')tog(false)});
dr.addEventListener('click',function(e){if(e.target.closest('nav a'))tog(false)});
/* header */
addEventListener('scroll',function(){$('hd').classList.toggle('solid',scrollY>innerHeight*.6)},{passive:true});
/* word reveal */
var words=document.querySelectorAll('.state .w');
R.progress('#state',function(el,p){var n=Math.round(Math.min(1,p*1.35)*words.length);words.forEach(function(w,i){w.classList.toggle('on',i<n)})});
R.parallax('.collage img,.member .ph img,.close-sec .bg');
</script>
</body>
</html>
